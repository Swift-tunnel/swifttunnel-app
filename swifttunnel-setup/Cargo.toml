[package]
name = "swifttunnel-setup"
version = "0.1.0"
edition = "2021"
description = "Desktop and Lite setup with a protected persistent MSI source"

[dependencies]
swifttunnel-installer-cache = { path = "../swifttunnel-installer-cache" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
static_vcruntime = "3"
embed-manifest = "1.4"

[[bin]]
name = "SwiftTunnel-Setup"
path = "src/main.rs"
